

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Twitter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .login-container {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        .btn-twitter {
            width: 100%;
            background-color: #1DA1F2;
            color: white;
            border-radius: 50px;
            padding: 15px;
            font-weight: bold;
            border: none;
            font-size: 16px;
            margin-top: 15px;
        }
        .btn-twitter:hover {
            background-color: #0d8cd6;
        }
        .login-error {
            color: red;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="photos/icons8-twitter-bird.gif" alt="Twitter Logo" width="80">
        <h2>Sign in to Twitter</h2>
        <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <input type="text" class="form-control" id="loginInput" placeholder="Phone, email, or username" required>
                <div class="invalid-feedback">Please provide a valid phone, email, or username.</div>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <div class="invalid-feedback">Please provide your password.</div>
            </div>
            <button type="submit" class="btn btn-twitter">Log in</button>
        </form>
        <p class="signup-link">Don't have an account? <a href="signup.html">Sign up</a></p>
        <div id="login-error" class="login-error">Invalid email, phone number, or password.</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const loginInput = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('password').value;

            let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            let foundUser = users.find(user => 
                user.email === loginInput || 
                user.phone === loginInput || 
                user.username === loginInput
            );

            if (!foundUser || foundUser.password !== password) {
                document.getElementById('login-error').style.display = 'block';
                return;
            }

            localStorage.setItem('loggedInUser', JSON.stringify(foundUser));
            window.location.href = 'home.html';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
