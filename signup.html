<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Twitter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f8fb;
            font-family: Arial, sans-serif;
        }
        .signup-container {
            max-width: 450px;
            width: 90%;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        .btn-twitter {
            width: 100%;
            background-color: #1DA1F2;
            color: white;
            border-radius: 20px;
            padding: 10px;
            font-weight: bold;
            border: none;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-twitter:hover {
            background-color: #0d8cd6;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <img src="photos/icons8-twitter-bird.gif" alt="Twitter Logo" width="70">
        <h2 class="mb-3">Sign up for Twitter</h2>

        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <form id="signupForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <input type="text" class="form-control" id="fullname" placeholder="Full Name" minlength="8" required>
                <div class="invalid-feedback">Full name must be at least 8 characters.</div>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
                <div class="invalid-feedback">Username is required.</div>
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>
            <div class="mb-3">
                <input type="tel" class="form-control" id="phone" placeholder="Phone Number" pattern="^\d{10,15}$" required>
                <div class="invalid-feedback">Phone number must be 10-15 digits.</div>
            </div>
            <div class="mb-3">
                <input type="date" class="form-control" id="dob" required>
                <div class="invalid-feedback">Select your date of birth.</div>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" minlength="6" required>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>
            <button type="submit" class="btn btn-twitter">Sign Up</button>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const form = this;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dob = document.getElementById('dob').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertMessage');

            if (password !== confirmPassword) {
                document.getElementById('confirmPassword').classList.add("is-invalid");
                return;
            } else {
                document.getElementById('confirmPassword').classList.remove("is-invalid");
            }

            let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            let existingUser = users.find(user => user.email === email || user.username === username || user.phone === phone);
            if (existingUser) {
                showAlert("User already exists. Please log in.", "danger");
                return;
            }

            let newUser = { fullname, username, email, phone, dob, password };
            users.push(newUser);
            localStorage.setItem('registeredUsers', JSON.stringify(users));

            showAlert("Registration successful! Redirecting to login...", "success");
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertMessage');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} mt-3`;
            alertBox.classList.remove('d-none');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
